default_config:
  adaptive_threshold: 0.75
  task_specific_scaling:
    translation: 1.2
    summarization: 1.0
    code_generation: 0.8
    question_answering: 1.1

  size_adaptation_factors:
    tiny: 0.4
    small: 0.7
    medium: 1.0
    large: 1.3
    xlarge: 1.6

  layer_wise_scaling: true
  size_adaptation_strategy: linear

optimized_presets:
  high_performance:
    adaptive_threshold: 0.65
    size_adaptation_strategy: exponential
    max_vocab_subset: 8192

  resource_constrained:
    adaptive_threshold: 0.85
    min_vocab_subset: 256
    max_vocab_subset: 2048
    size_adaptation_strategy: linear

task_specific_presets:
  translation:
    task_specific_scaling:
      translation: 1.4
    layer_wise_scaling: false

  code_generation:
    size_adaptation_strategy: exponential
    max_vocab_subset: 16384