apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  namespace: speculative-inference
spec:
  replicas: 3
  selector:
    matchLabels:
      app: speculative-app
  template:
    metadata:
      labels:
        app: speculative-app
    spec:
      containers:
      - name: app
        image: speculative-decoding:latest
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_HOST
          value: redis-service.speculative-inference.svc.cluster.local
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5